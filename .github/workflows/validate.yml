name: Validate samples

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: python -m pip install jsonschema
      - name: Check bundled archives (.manjiz)
        run: |
          for f in samples/builtin/*.manjiz samples/manji_sample_archive.manjiz; do
            echo "== $f"
            python3 tools/pack_manji.py --check "$f"
          done
      - name: Validate standalone scripts (.manji)
        run: |
          for f in samples/builtin/*.manji samples/*.manji; do
            echo "== $f"
            python3 -m jsonschema -i "$f" docs/manji.schema.json
          done
      - name: Check catalog matches embedded samples
        run: |
          python3 - <<'EOF'
          import json, re
          html = open("index.html", encoding="utf-8").read()
          m = re.search(r'<script type="application/json" id="builtinData">(.*?)</script>', html, re.S)
          assert m, "builtinData not found in index.html"
          embedded = [{k: v for k, v in w.items() if k != "data"} for w in json.loads(m.group(1))["works"]]
          catalog = json.load(open("samples/builtin/catalog.json", encoding="utf-8"))["works"]
          assert catalog == embedded, (
              "catalog.json and builtinData differ:\n"
              f"catalog ids: {[w['id'] for w in catalog]}\n"
              f"embedded ids: {[w['id'] for w in embedded]}"
          )
          print(f"OK: catalog matches embedded samples ({len(catalog)} works)")
          EOF
      - name: Check engine version strings agree
        run: |
          python3 - <<'EOF'
          import re
          html = open("index.html", encoding="utf-8").read()
          header = re.search(r"漫字（まんじ）エンジン v([0-9]+\.[0-9]+\.[0-9]+)", html)
          code = re.search(r'version: "([0-9]+\.[0-9]+\.[0-9]+)"', html)
          assert header and code, "version string not found in index.html"
          assert header.group(1) == code.group(1), (
              f"version mismatch: header comment {header.group(1)} vs Manji.version {code.group(1)}"
          )
          print(f"OK: engine version strings agree ({code.group(1)})")
          EOF
      - name: Check kit files match the repository
        run: |
          python3 - <<'EOF'
          import os, zipfile
          # Files whose place in the kit differs from their place in the repo.
          SPECIAL = {
              "player.html": "index.html",
              "README_ja.md": "docs/README_ja.md",
              "MANJI_AI_GUIDE.md": "docs/MANJI_AI_GUIDE.md",
              "manji.schema.json": "docs/manji.schema.json",
              "manifest.schema.json": "docs/manifest.schema.json",
          }
          z = zipfile.ZipFile("manji_kit.zip")
          diffs, checked = [], 0
          for name in z.namelist():
              if name.endswith("/"):
                  continue
              rel = name[len("manji_kit/"):]
              repo = SPECIAL.get(rel, rel)
              if not os.path.exists(repo):
                  continue  # kit-only file (generator scripts, sample sources)
              checked += 1
              if z.read(name) != open(repo, "rb").read():
                  diffs.append(f"{name} != {repo}")
          assert not diffs, "kit files out of sync:\n" + "\n".join(diffs)
          print(f"OK: kit files match the repository ({checked} files checked)")
          EOF
